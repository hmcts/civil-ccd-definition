plugins {
  id 'java'
  id 'java-library'
  id 'jacoco'
  id 'maven-publish'
}

group 'com.github.hmcts'
version 'DEV-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

repositories {
  mavenLocal()
  mavenCentral()
  maven {
    url 'https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1'
  }
  // Fallback mirror, deliberately LAST. This repo uses dependency locking, so resolution needs the
  // exact pinned versions; when mavenCentral is unreachable from the build agents there is no second
  // source and every locked dependency fails at once (DTSCCI-6647). Keeping mavenCentral first means
  // agents that can reach it are unaffected, and anything that cannot reach Artifactory - GitHub
  // hosted runners, which PlatOps will not grant access to - still resolves from the public repos.
  maven {
    url = uri('https://artifactory.platform.hmcts.net/artifactory/maven-remotes')
  }
}

tasks.register('highLevelDataSetup', JavaExec) {
  mainClass = "uk.gov.hmcts.reform.civil.HighLevelDataSetupApp"
  classpath += sourceSets.main.runtimeClasspath
  jvmArgs = ['--add-opens=java.base/java.lang.reflect=ALL-UNNAMED']
}



def versions = [
  junit              : '6.1.3',
  junitPlatform      : '6.1.3'
]

ext.libraries = [
  junit5: [
    "org.junit.jupiter:junit-jupiter-api:${versions.junit}",
    "org.junit.jupiter:junit-jupiter-engine:${versions.junit}",
    "org.junit.jupiter:junit-jupiter-params:${versions.junit}",
    "org.junit.platform:junit-platform-commons:${versions.junitPlatform}",
    "org.junit.platform:junit-platform-engine:${versions.junitPlatform}"
  ]
]

dependencyLocking {
  lockAllConfigurations()
}

dependencies {
  implementation group: 'com.github.hmcts', name: 'befta-fw', version: '9.2.8'
  implementation group: 'org.slf4j', name: 'slf4j-api', version: '2.0.19'
  implementation group: 'io.rest-assured', name: 'rest-assured', version: '6.0.0'

  testImplementation libraries.junit5
}

publishing {
  repositories {
    maven {
      name = "AzureArtifacts"
      url = uri("https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1")
      credentials {
        username = System.getenv("AZURE_DEVOPS_ARTIFACT_USERNAME")
        password = System.getenv("AZURE_DEVOPS_ARTIFACT_TOKEN")
      }
    }
  }
}
