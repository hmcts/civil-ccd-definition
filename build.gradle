cd-def-cleanupplugins {
  id 'java'
  id 'java-library'
  id 'jacoco'
}

group 'com.github.hmcts'
version 'DEV-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

repositories {
  mavenLocal()
  mavenCentral()
  maven {
    url 'https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1'
  }
}

// The CCD definition stores this repo shares with civil-service, and the civil-service branch that
// imports into each. Exactly one of the two repos imports into each store: this one while it is the source
// of truth for the definitions, civil-service once ccd-definition/SOURCE_OF_TRUTH is on that branch.
// Preview stacks are each repo's own, so they are always imported into.
def sharedCcdEnvironments = [aat: 'master', prod: 'master', demo: 'demo', perftest: 'perftest', ithc: 'ithc']

// Asks bin/shared/pull-ccd-definitions.sh, pulled from civil-service by Jenkinsfile_CNP before this stage, so
// the import follows the same decision as the copy of the definitions. Any failure fails the stage rather
// than picking a repo.
def ccdDefinitionsSourceOfTruth = { String civilServiceRef ->
  def script = file('bin/shared/pull-ccd-definitions.sh')
  if (!script.exists()) {
    throw new GradleException("${script} is missing. It comes from civil-service's bin/shared " +
      '(bin/pull-latest-civil-shared.sh), and decides which repo imports into the shared environments.')
  }
  def source = providers.exec {
    commandLine 'bash', script.path, '--check', civilServiceRef
  }.standardOutput.asText.get().trim()
  if (!(source in ['civil-service', 'civil-ccd-definition'])) {
    throw new GradleException("Unexpected source of truth from ${script.name} --check ${civilServiceRef}: '${source}'")
  }
  source
}

tasks.register('highLevelDataSetup', JavaExec) {
  onlyIf('civil-ccd-definition is the source of truth for the CCD definitions') { task ->
    def environment = task.args ? task.args[0] : null
    def civilServiceRef = sharedCcdEnvironments[environment]
    if (civilServiceRef == null) {
      return true
    }
    def source = ccdDefinitionsSourceOfTruth(civilServiceRef)
    if (source == 'civil-service') {
      logger.lifecycle("Not importing into ${environment}: ccd-definition/SOURCE_OF_TRUTH is on civil-service " +
        "${civilServiceRef}, so civil-service is the source of truth for the CCD definitions and imports them.")
    }
    source == 'civil-ccd-definition'
  }
  mainClass = "uk.gov.hmcts.reform.civil.HighLevelDataSetupApp"
  classpath += sourceSets.main.runtimeClasspath
  jvmArgs = ['--add-opens=java.base/java.lang.reflect=ALL-UNNAMED']
}



def versions = [
  junit              : '6.1.3',
  junitPlatform      : '6.1.3'
]

ext.libraries = [
  junit5: [
    "org.junit.jupiter:junit-jupiter-api:${versions.junit}",
    "org.junit.jupiter:junit-jupiter-engine:${versions.junit}",
    "org.junit.jupiter:junit-jupiter-params:${versions.junit}",
    "org.junit.platform:junit-platform-commons:${versions.junitPlatform}",
    "org.junit.platform:junit-platform-engine:${versions.junitPlatform}"
  ]
]

dependencyLocking {
  lockAllConfigurations()
}

dependencies {
  implementation group: 'com.github.hmcts', name: 'befta-fw', version: '9.2.12_CCD-8388'
  implementation group: 'org.slf4j', name: 'slf4j-api', version: '2.0.20'
  implementation group: 'io.rest-assured', name: 'rest-assured', version: '6.3.0'
  // BEFTA's older Logback JARs are unavailable from the Jenkins Maven mirror.
  runtimeOnly 'ch.qos.logback:logback-classic:1.6.8'

  testImplementation libraries.junit5
}
